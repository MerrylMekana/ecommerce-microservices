spring.application.name=api-gateway
server.port=9000
product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8080}
order.service.url=${ORDER_SERVICE_URL:http://localhost:8081}
inventory.service.url=${INVENTORY_SERVICE_URL:http://localhost:8082}
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/spring-ms-security-realm
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.urls[0].name=Product Service
springdoc.swagger-ui.urls[0].url=/aggregate/product-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Order Service
springdoc.swagger-ui.urls[1].url=/aggregate/order-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Inventory Service
springdoc.swagger-ui.urls[2].url=/aggregate/inventory-service/v3/api-docs

#Actuator endpoints

management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
loki.url=${LOKI_URL:http://localhost:3100/loki/api/v1/push}

#Resilience4j properties: to apply resilience4j circuit breaker configuration as default

resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.registerHealthIndicator=true

resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
#circuit breaker gets enabled when 50%(failure threshold) of 10 requests(slidingWindowSize) fails(ie 5)
#it has closed, open and half-open states. allows requests in closed state, doesnt in open state. after open state, it moves to half open to check if requests are processed correctly
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
#will go from closed to open once 5 calls fail.. otherwise will not take failure thresh into account

#Resilience4j timeout properties

resilience4j.timelimiter.configs.default.timeout-duration=3s

#Resilience4j retry properties

resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=2s
#it will try the failed request 3 times(each after 2 seconds) before finally going into timeout
