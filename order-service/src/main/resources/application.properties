spring.application.name=order-service
#will be jdbc url of mysql database
spring.datasource.url=jdbc:mysql://localhost:3306/order_service
spring.datasource.username=root
spring.datasource.password=mysql
#disables ddl handling for hibernate. doing this because database migration should be done using flyaway
spring.jpa.hibernate.ddl-auto=none
server.port=8081
server.address=${SERVER_ADDRESS:127.0.0.1}
inventory.url=${INVENTORY_URL:http://localhost:8082}
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/spring-ms-security-realm
spring.security.oauth2.client.registration.inventory-service.provider=keycloak
spring.security.oauth2.client.registration.inventory-service.client-id=${ORDER_INVENTORY_CLIENT_ID:order-service}
spring.security.oauth2.client.registration.inventory-service.client-secret=${ORDER_INVENTORY_CLIENT_SECRET}
spring.security.oauth2.client.registration.inventory-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://localhost:8181/realms/spring-ms-security-realm/protocol/openid-connect/token}

#Actuator endpoints

management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
loki.url=${LOKI_URL:http://localhost:3100/loki/api/v1/push}

#resilience4j properties

resilience4j.circuitbreaker.instances.inventory.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.inventory.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.inventory.slidingWindowSize=10
resilience4j.circuitbreaker.instances.inventory.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventory.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.inventory.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.inventory.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.inventory.minimum-number-of-calls=5

#Resilience4j timeout properties

resilience4j.timelimiter.instances.inventory.timeout-duration=3s

#Resilience4j retry properties

resilience4j.retry.instances.inventory.max-attempts=3
resilience4j.retry.instances.inventory.wait-duration=2s

#kafka properties
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=order-placed
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.properties.schema.registry.url=http://127.0.0.1:8085
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
order.kafka.topic=order-placed
order.outbox.poll-interval-ms=${ORDER_OUTBOX_POLL_INTERVAL_MS:1000}
order.outbox.lease-duration-seconds=${ORDER_OUTBOX_LEASE_SECONDS:60}
order.outbox.publish-timeout-seconds=${ORDER_OUTBOX_PUBLISH_TIMEOUT_SECONDS:10}
