<article class="group flex h-full flex-col overflow-hidden rounded-2xl border border-line bg-white transition duration-200 hover:-translate-y-0.5 hover:shadow-[0_16px_40px_-28px_rgba(32,39,35,0.4)]">
  <a [routerLink]="['/products', product().skuCode]" class="relative block aspect-[4/3] overflow-hidden bg-[#edf0eb]" [attr.aria-label]="'View ' + product().name">
    <div class="absolute inset-4 grid place-items-center rounded-xl border border-white/70 bg-[#e1e8df] transition group-hover:bg-[#d8e2d8]">
      <span class="max-w-[80%] text-center text-3xl font-light tracking-tight text-accent/80" aria-hidden="true">{{ product().name.slice(0, 1) }}</span>
    </div>
    <span class="absolute bottom-3 left-3 rounded-full bg-white/90 px-3 py-1 text-[10px] font-semibold uppercase tracking-[0.15em] text-muted">{{ product().skuCode }}</span>
  </a>
  <div class="flex flex-1 flex-col p-4 sm:p-5">
    <a [routerLink]="['/products', product().skuCode]" class="line-clamp-1 text-base font-semibold text-ink transition hover:text-accent">{{ product().name }}</a>
    <p class="mt-2 line-clamp-2 min-h-10 text-sm leading-5 text-muted">{{ product().description }}</p>
    <div class="mt-4 flex items-center justify-between">
      <span class="text-base font-semibold text-ink">{{ formatPrice(product().price) }}</span>
      <app-quantity-control [value]="quantity()" label="Product quantity" (valueChange)="quantity.set($event)"></app-quantity-control>
    </div>
    <button type="button" (click)="addToCart()"
            class="mt-4 min-h-11 w-full rounded-full bg-accent px-4 text-sm font-semibold text-white transition hover:bg-accent-dark">
      Add to cart
    </button>
  </div>
</article>
