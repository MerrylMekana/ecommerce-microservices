
<nav class="bg-white border border-gray-200 px-2 sm:px-4 py-2.5 rounded shadow">
  <div class="container flex flex-wrap justify-between items-center mx-auto">

    <!-- Shop name -->
    <a href="/" class="flex items-center">
      <span class="self-center text-xl font-semibold whitespace-nowrap">
        Spring Boot Microservices Shop
      </span>
    </a>

    <!-- Authentication -->
    <div class="flex items-center">

      @if (isAuthenticated) {

        <span class="text-gray-700 mr-4">
          Welcome {{ username }}
        </span>

        <a
          routerLink="/add-product"
          class="bg-black text-white px-4 py-2 rounded-lg hover:bg-gray-800">
          Add Product
        </a>

        <button
          type="button"
          (click)="logout()"
          class="text-gray-700 hover:text-blue-700 cursor-pointer">
          Logout
        </button>

      } @else {

        <button
          type="button"
          (click)="login()"
          class="text-gray-700 hover:text-blue-700 cursor-pointer">
          Login
        </button>

      }

    </div>

  </div>
</nav>
