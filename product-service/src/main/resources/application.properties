spring.application.name=product-service
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/sring-ms-security-realm
#username and password will be created in the admin collection. authsource is telling mongodb to take the username and password in the uri and authenticate it against the admin database
#spring.mongodb.uri=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/product-service?authSource=admin
spring.mongodb.uri=mongodb://root:password@localhost:27017/product-service?authSource=admin
springdoc.swagger-ui.path=/swagger-ui.html
#by using this, we can access the rest api documentation from (for eg) the url... http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/api-docs
#if we access http://localhost:8080/api-docs, we can see rest api documentation in the form of json


management.endpoints.web.exposure.include= health,info,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=product-service